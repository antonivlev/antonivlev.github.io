<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - Cool Design</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="background-animation">
            <div class="floating-shapes">
                <div class="shape shape-1"></div>
                <div class="shape shape-2"></div>
                <div class="shape shape-3"></div>
                <div class="shape shape-4"></div>
                <div class="shape shape-5"></div>
            </div>
        </div>
        
        <header class="header">
            <nav class="nav">
                <div class="logo">
                    <span class="logo-text">HW</span>
                </div>
                <div class="nav-links">
                    <a href="#" class="nav-link">Home</a>
                    <a href="#" class="nav-link">About</a>
                    <a href="#" class="nav-link">Contact</a>
                </div>
            </nav>
        </header>

        <main class="main-content">
            <div class="hero-section">
                <div class="text-content">
                    <h1 class="main-title">
                        <span class="title-line">Hello</span>
                        <span class="title-line gradient-text">World</span>
                    </h1>
                    <p class="subtitle">
                        Welcome to a beautifully crafted digital experience
                    </p>
                    <div class="cta-buttons">
                        <button class="btn btn-primary" id="exploreBtn">
                            <span>Explore</span>
                            <div class="btn-ripple"></div>
                        </button>
                        <button class="btn btn-secondary" id="learnBtn">
                            <span>Learn More</span>
                        </button>
                    </div>
                </div>
                
                <div class="visual-element">
                    <div class="code-window">
                        <div class="window-header">
                            <div class="window-controls">
                                <span class="control control-close"></span>
                                <span class="control control-minimize"></span>
                                <span class="control control-maximize"></span>
                            </div>
                            <div class="window-title">hello-world.js</div>
                        </div>
                        <div class="code-content">
                            <div class="code-line">
                                <span class="line-number">1</span>
                                <span class="code-text">
                                    <span class="keyword">function</span> 
                                    <span class="function-name">sayHello</span>() {
                                </span>
                            </div>
                            <div class="code-line">
                                <span class="line-number">2</span>
                                <span class="code-text">
                                    &nbsp;&nbsp;<span class="keyword">console</span>.<span class="method">log</span>(<span class="string">'Hello, World!'</span>);
                                </span>
                            </div>
                            <div class="code-line">
                                <span class="line-number">3</span>
                                <span class="code-text">}</span>
                            </div>
                            <div class="code-line">
                                <span class="line-number">4</span>
                                <span class="code-text"></span>
                            </div>
                            <div class="code-line">
                                <span class="line-number">5</span>
                                <span class="code-text">
                                    <span class="function-name">sayHello</span>();
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-content">
                <p>&copy; 2024 Hello World. Made with ❤️ and modern web technologies.</p>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
